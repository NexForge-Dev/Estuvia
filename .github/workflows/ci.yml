name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Os testes não acessam a rede nem provedores de IA pagos (provedores falsos e HTML oficial salvo).
      - run: npm test
        env:
          RADAR_SCHEDULER: 'off'
      - run: npm audit --omit=dev --audit-level=high
