name: Radar (coleta agendada)

# Complementa o Vercel Cron (diário, em vercel.json): chama a coleta do Radar a cada 2 horas.
# Só roda na branch padrão (main). Precisa de dois segredos do repositório
# (Settings → Secrets and variables → Actions):
#   ESTUVIA_CRON_URL  ex.: https://app.estuvia.com/api/cron/radar
#   CRON_SECRET       o mesmo valor da variável CRON_SECRET na Vercel
# Sem eles, o job termina sem fazer nada.

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar /api/cron/radar
        env:
          CRON_URL: ${{ secrets.ESTUVIA_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Segredos ESTUVIA_CRON_URL/CRON_SECRET não definidos: nada a fazer."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$CRON_URL"
